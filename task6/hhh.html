<!DOCTYPE html>
<html>
<head>
    <title>Array Methods</title>
</head>

<body>

    <button onclick="buttonOne()">Button One</button>
    <button onclick="buttonTwo()">Button Two</button>
    <button onclick="buttonThree()">Button Three</button>
    <button onclick="buttonFour()">Button Four</button>
    <button onclick="buttonFive()">Button Five</button>


    <script>

        function createArray() {
            let arr = [];

            for (let i = 0; i <= 100; i++) {
                arr.push(i);
            }

            return arr;
        }

        function buttonOne() {
            let arr = createArray();

            let result = arr.filter(function(number) {
                return number % 3 !== 0;
            });

            console.log(result);
        }

        function buttonTwo() {
            let arr = createArray();

            for (let i = 101; i <= 150; i++) {
                arr.push(i);
            }

            console.log(arr);
        }

        function buttonThree() {
            let arr = createArray();

            let result = arr.map(function(number) {
                return number + 3;
            });

            console.log(result);
        }


        function buttonFour() {
            let arr = createArray();

            let result = arr.slice(20, 41);

            console.log(result);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }


        function buttonFive() {
            let arr = createArray();

            shuffleArray(arr);

            console.log("Shuffled array:");
            console.log(arr);

            arr.sort(function(a, b) {
                return b - a;
            });

            console.log("Sorted descending:");
            console.log(arr);
        }


    </script>

</body>
</html>
