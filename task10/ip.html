<!DOCTYPE html>
<html>
<head>
    <title>Get IP</title>
</head>

<body>

    <button id="ipButton" onclick="getIP()">Get ip</button>

    <script>

        function getIP() {

            fetch("https://api.ipify.org/")
                .then(response => response.text())
                .then(ip => {

                    document.getElementById("ipButton").innerHTML = ip;

                })
                .catch(error => {
                    console.log("Error:", error);
                });

        }

    </script>

</body>
</html>
